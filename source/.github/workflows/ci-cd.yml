name: CI/CD

on:
  push:
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [service-auth, service-content, service-audio]
    env:
      TESTING: "1"
      AUDIO_DIR: /tmp/audio_files
      JWT_SECRET: test-secret-key-32bytes-for-ci-only!!
      MONGO_URI: mongodb://localhost:27017
      DB_NAME: zoo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài thư viện
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements.txt pytest httpx
      - name: Chạy pytest
        working-directory: ${{ matrix.service }}
        run: pytest -v

  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3 service
        run: docker compose build
