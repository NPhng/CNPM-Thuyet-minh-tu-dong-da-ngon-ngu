# Chạy: docker compose up --build
# Dừng giữ data: docker compose down
# Xóa data: docker compose down -v

services:
  # Mỗi service sở hữu một MongoDB riêng; service khác không kết nối trực tiếp.
  mongo-auth:
    image: mongo:7
    container_name: zoo-mongo-auth
    ports:
      - "127.0.0.1:27018:27017"
    networks:
      - zoo-network
    volumes:
      - mongo_auth_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${AUTH_DB_NAME:-zoo_auth}
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo-content:
    image: mongo:7
    container_name: zoo-mongo-content
    ports:
      - "127.0.0.1:27019:27017"
    networks:
      - zoo-network
    volumes:
      - mongo_content_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${CONTENT_DB_NAME:-zoo_content}
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo-audio:
    image: mongo:7
    container_name: zoo-mongo-audio
    ports:
      - "127.0.0.1:27020:27017"
    networks:
      - zoo-network
    volumes:
      - mongo_audio_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${AUDIO_DB_NAME:-zoo_audio}
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  auth-service:
    build:
      context: ./service-auth
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8001"
    networks:
      - zoo-network
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      - MONGO_URI=mongodb://mongo-auth:27017
      - DB_NAME=${AUTH_DB_NAME:-zoo_auth}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required - set it in .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required - set it in .env}
      - COUNTER_USERNAME=${COUNTER_USERNAME:-counter01}
      - COUNTER_PASSWORD=${COUNTER_PASSWORD:?COUNTER_PASSWORD is required - set it in .env}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      - TICKET_TTL=${TICKET_TTL:-end_of_day}
      - ACTIVATE_RATE_LIMIT=${ACTIVATE_RATE_LIMIT:-20}
      - ACTIVATE_IP_RATE_LIMIT=${ACTIVATE_IP_RATE_LIMIT:-300}
      - ACTIVATE_RATE_WINDOW_SEC=${ACTIVATE_RATE_WINDOW_SEC:-60}
    depends_on:
      mongo-auth:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  content-service:
    build:
      context: ./service-content
      dockerfile: Dockerfile
    container_name: content-service
    ports:
      - "8002:8002"
    networks:
      - zoo-network
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      - MONGO_URI=mongodb://mongo-content:27017
      - DB_NAME=${CONTENT_DB_NAME:-zoo_content}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - AUDIO_SERVICE_URL=http://audio-service:8003
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required - set it in .env}
      - N_ACTIVE_MINUTES=${N_ACTIVE_MINUTES:-10}
      - PRESENCE_ENTER_TTL_MINUTES=${PRESENCE_ENTER_TTL_MINUTES:-120}
      - EVENT_DEDUPE_SECONDS=${EVENT_DEDUPE_SECONDS:-30}
      - EVENT_RATE_LIMIT=${EVENT_RATE_LIMIT:-30}
      - EVENT_RATE_WINDOW_SEC=${EVENT_RATE_WINDOW_SEC:-60}
      - GEO_TOLERANCE_M=${GEO_TOLERANCE_M:-20}
      - EVENT_REQUIRE_GPS=${EVENT_REQUIRE_GPS:-false}
      - SEED_POI_PATH=/app/seed/pois.json
    depends_on:
      mongo-content:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      audio-service:
        condition: service_healthy
    volumes:
      - ./seed:/app/seed:ro
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  audio-service:
    build:
      context: ./service-audio
      dockerfile: Dockerfile
    container_name: audio-service
    ports:
      - "8003:8003"
    networks:
      - zoo-network
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      - MONGO_URI=mongodb://mongo-audio:27017
      - DB_NAME=${AUDIO_DB_NAME:-zoo_audio}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - CONTENT_SERVICE_URL=http://content-service:8002
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY is required - set it in .env}
      - AUDIO_DIR=/app/audio_files
    depends_on:
      mongo-audio:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - audio_files:/app/audio_files
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  zoo-network:
    driver: bridge

volumes:
  mongo_auth_data:
  mongo_content_data:
  mongo_audio_data:
  audio_files: